[project]
name = "astrbot-plugin-teamspeakbot"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["ts-async-api"]

[tool.uv.sources]
ts-async-api = { git = "https://github.com/Next-Page-Vi/ts-async-api.git", rev = "c30e24a7c26ab26aaff74a4307594c596190550c" }

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.1,<2", "ruff>=0.12"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
